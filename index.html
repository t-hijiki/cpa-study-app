<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CPA学習">
  <link rel="apple-touch-icon" href="icon.png">

  <title>CPA短答 学習アプリ</title>
  
  <style>
    :root{
      --bg:#f5f5f7;
      --card:#ffffff;
      --text:#1d1d1f;
      --sub:#6e6e73;
      --accent:#0071e3;
      --border:#e5e5ea;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{
      max-width:520px;
      margin:0 auto;
      padding:24px 18px 40px;
    }
    h1{
      font-size:28px;
      margin:8px 0 18px;
      text-align:center;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:24px;
      margin-bottom:16px;
      box-shadow:0 6px 20px rgba(0,0,0,.05);
    }
    .label{
      color:var(--sub);
      font-size:14px;
      margin-bottom:8px;
      text-align:center;
    }
    .days{
      text-align:center;
      font-size:44px;
      font-weight:700;
      line-height:1.1;
    }
    .date{
      text-align:center;
      color:var(--sub);
      margin-top:8px;
      font-size:14px;
    }
    .subject{
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:30px;
      font-weight:700;
      margin:10px 0 18px;
    }
    button{
      width:100%;
      border:0;
      border-radius:14px;
      background:var(--accent);
      color:white;
      font-size:18px;
      font-weight:700;
      padding:16px;
      cursor:pointer;
    }
    button:active{transform:scale(.99)}
    .subjects{
      margin-top:18px;
      font-size:13px;
      color:var(--sub);
      line-height:1.7;
    }
    .note{
      text-align:center;
      color:var(--sub);
      font-size:12px;
      margin-top:16px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>CPA短答 学習アプリ</h1>

    <section class="card">
      <div class="label">2026年12月13日まで</div>
      <div id="days" class="days">--日</div>
      <div id="today" class="date"></div>
    </section>

    <section class="card">
      <div class="label">今日の科目</div>
      <div id="subject" class="subject">まだ選んでいません</div>
      <button id="pick">今日の科目を選ぶ</button>

      <div class="subjects">
        対象：財務会計論・管理会計論・監査論・企業法・租税法・経営学
      </div>
    </section>

    <div class="note">データ通信なしでも、このページ自体は動作します。</div>
  </main>

  <script>
    const examDate = new Date("2026-12-13T00:00:00+09:00");
    const subjects = [
      "財務会計論",
      "管理会計論",
      "監査論",
      "企業法",
      "租税法",
      "経営学"
    ];

    function updateCountdown(){
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const exam = new Date(examDate.getFullYear(), examDate.getMonth(), examDate.getDate());
      const msPerDay = 1000 * 60 * 60 * 24;
      const diff = Math.ceil((exam - today) / msPerDay);

      const daysEl = document.getElementById("days");
      if(diff > 0){
        daysEl.textContent = `あと ${diff} 日`;
      }else if(diff === 0){
        daysEl.textContent = "試験当日";
      }else{
        daysEl.textContent = `試験日から ${Math.abs(diff)} 日`;
      }

      document.getElementById("today").textContent =
        now.toLocaleDateString("ja-JP", {
          year:"numeric", month:"long", day:"numeric", weekday:"short"
        });
    }

    document.getElementById("pick").addEventListener("click", () => {
      const i = Math.floor(Math.random() * subjects.length);
      document.getElementById("subject").textContent = subjects[i];
    });

    updateCountdown();
  </script>
</body>
</html>
